<div class="quick-add">
  <header class="quick-add-header">
    <h2>Add to Mistake Notebook</h2>
    <button type="button" (click)="cancel()" aria-label="Cancel">×</button>
  </header>

  <section class="known-fields">
    <p><strong>Skill:</strong> {{ data.skill }}</p>
    <p><strong>Source:</strong> {{ data.source }}</p>
    <p><strong>Your answer:</strong> {{ data.ownAnswer }}</p>
    <p><strong>Correct answer:</strong> {{ data.correctAnswer }}</p>
  </section>

  <section class="reason-picker">
    <p>Why did this happen?</p>
    <div class="reason-options">
      @for (option of reasonOptions; track option.key) {
        <button
          type="button"
          class="reason-option"
          [class.selected]="selectedReason === option.key"
          (click)="selectReason(option.key)">
          {{ option.label }}
        </button>
      }
    </div>
  </section>

  <footer class="quick-add-actions">
    <button class="primary" type="button" [disabled]="saving" (click)="save()">
      {{ selectedReason ? 'Add to Notebook' : 'Skip Reason & Add Anyway' }}
    </button>
  </footer>
</div>
