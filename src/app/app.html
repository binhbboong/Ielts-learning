@if (authState.authenticated()) {
  <header class="app-header">
    <nav class="app-nav" data-testid="app-nav" aria-label="Study navigation">
      <a
        data-testid="nav-today"
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >Today</a>
      <a
        data-testid="nav-vocabulary"
        routerLink="/vocabulary"
        routerLinkActive="active"
      >Vocabulary</a>
      <a
        data-testid="nav-mistakes"
        routerLink="/mistakes"
        routerLinkActive="active"
      >Mistakes</a>
      <a
        data-testid="nav-progress"
        routerLink="/progress"
        routerLinkActive="active"
      >Progress</a>
    </nav>

    <div class="auth-controls">
      <a data-testid="nav-export" class="export-link" routerLink="/export" routerLinkActive="active">Export</a>
      <span data-testid="auth-indicator">Recognized as learner</span>
      <button data-testid="logout" type="button" [disabled]="loggingOut" (click)="logout()">
        {{ loggingOut ? 'Logging out...' : 'Log out' }}
      </button>
    </div>
  </header>
}

<router-outlet />
